language: yongning-na_01
data_roots:
  -  ~/projects/my-projects/asr-models/language-downloads/yongning-na_01/doreco_yong1270_core_v2.0/
transcription_globs:
  - "*.txt"
  - "*.eaf"
  - "*.TextGrid"
  - "*.csv"
  - "*.tsv"

# Every discovered format listed in the prefer section is normalised. Those not listed are ignored and documented in the logs.
prefer:
  - ".eaf"

# Structured transcription selectors accept one name, a list of names, or all.
eaf_tier: W-0
textgrid_tier: all

# Delimited-table selectors accept header names, 1-based column numbers, or all.
csv_has_header: true
csv_text_column: all
tsv_has_header: true
tsv_text_column: all
txt_delimiter: tab
txt_has_header: false
txt_text_column: 4

# Logs remain in this project at output/logs/<language>/<timestamp>/.
logs_dir: logs

# Current default policy for ASR training text.
remove_bracketed_text: true # Remove all text inside brackets, including the brackets themselves, and replaces the whole string with a single space. Go to line 341 in scripts/normalise_data.py to add more bracket types if needed.
remove_chars: true # Remove all characters in chars_to_remove below
replace_sequences: true # Replace multi-character sequences with single-character symbols, as defined in sequence_replacements below
lowercase_text: false
map_tones: true
collapse_whitespace: True # If there are multiple spaces in a row, replace them with a single space
strip_spaces: false # Remove all whitespace

# Ordered, editable forward normalization pipeline.
# The reverse pipeline is generated automatically where mappings are one-to-one.
normalization_steps:
  - remove_bracketed_text
  - replace_sequences
  - lowercase_text
  - map_tones
  - remove_chars
  - collapse_whitespace
  - strip_spaces

chars_to_remove: # When remove_chars is true, these characters will be removed from the text
  - "."
  - "?"
  - "？"
  - "."
  - "("
  - ")"
  - "#"
  - "$"
  - "~"
  - "."
  - "="
  - "*"

# Multi-character transcription symbols can be made single-character here.
# Format: "source=>target"
sequence_replacements:
  - "tʰ=>þ"
  - "kʰ=>ƙ"
  - "pʰ=>ƥ"
#  - "sʰ=>ƨ"
  - "ʈʰ=>Ʈ"
  - "qʰ=>ƣ"
#  - "ɕʰ=>Ƭ"
#  - "ʂʰ=>Ʃ"
#  - "tsʰ=>ƾ"
  - "tʂʰ=>ƪ"
  - "tɕʰ=>ƫ"
  - ",=> "

# Tone numbers can be mapped to single machine-trainable symbols.
# Format: "source=>target"
tone_replacements:
#  - "33=>M"
#  - "35=>R"
#  - "53=>F"
#  - "55=>H"
  - "˥=>H"
  - "˧=>M"
  - "˩=>L"
  - "˧˥=>Q"
  - "˩˥=>W"
  - "˩˧=>E"

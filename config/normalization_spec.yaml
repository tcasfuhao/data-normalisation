language: yonghe_qiang_03
data_roots:
  - ~/projects/my-projects/asr-models/yonghe-qiang/data/raw/YH-758
  - ~/projects/my-projects/asr-models/yonghe-qiang/data/raw/YH-868
  - ~/projects/my-projects/asr-models/yonghe-qiang/data/raw/YH-999
transcription_globs:
  - "*.txt"
  - "*.eaf"
prefer_eaf: true
output_dir: output/
eaf_output_dir: output/eaf/
summary_csv_path: output/logs/{language}_normalisation_summary.csv

# Current default policy for ASR training text.
remove_bracketed_text: true
replace_sequences: true
map_tones: true
lowercase_text: true
remove_punctuation: true
remove_hash: true
collapse_whitespace: true # if there are multiple spaces in a row, replace with a single space
strip_spaces: true # remove all whitespace
remove_diacritics: false

# Ordered, editable forward normalization pipeline.
# The reverse pipeline is generated automatically where mappings are one-to-one.
normalization_steps:
  - remove_bracketed_text
  - replace_sequences
  - lowercase_text
  - map_tones
  - remove_punctuation
  - remove_hash
  - collapse_whitespace
  - strip_spaces
  - remove_diacritics

# Multi-character transcription symbols can be made single-character here.
# Format: "source=>target"
sequence_replacements:
  - "tʰ=>þ"
  - "kʰ=>ƙ"
  - "pʰ=>ƥ"
  - "tsʰ=>ƾ"
  - "tʂʰ=>ƪ"
  - "tɕʰ=>ƫ"

# Tone numbers can be mapped to single machine-trainable symbols.
# Format: "source=>target"
tone_replacements:
  - "33=>M"
  - "35=>R"
  - "53=>F"
  - "55=>H"

remove_chars:
  - ","
  - "?"
  - "？"
  - "."
  - "("
  - ")"
  - "#"
